services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development # ◄ CRITICAL: Tells Docker to stop at the dev stage
    # Command overrides the default to ensure NestJS runs in watch mode
    command: npm run start:dev
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://backend:backend@postgres:5432/backend_mastery
      - REDIS_URL=${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-network

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
      POSTGRES_DB: backend_mastery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d backend_mastery"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shared-network

    develop:
      watch:
        # Sync local changes into the container's /app/src folder
        - path: ./src
          action: sync
          target: /app/src # ◄ Matches the WORKDIR /app in your Dockerfile
          ignore:
            - node_modules/

        - path: ./package.json
          action: rebuild
        - path: ./package-lock.json
          action: rebuild

networks:
  shared-network:
    external: true

volumes:
  postgres_data:
